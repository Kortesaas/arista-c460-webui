<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#031e56" />
    <meta name="color-scheme" content="dark light" />
    <title>ARRR-ISTA C460</title>
    <meta name="description" content="Local management for the C-460 access point." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Apply the stored theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem('c460-theme') || 'light'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
